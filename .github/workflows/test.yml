# 自证：单测 + 真实转换冒烟。不装 LibreOffice —— 只验证 Word 路径（零外部二进制）。
name: test

on:
  push:
    branches: [main]
  pull_request:
  # 兜底：偶发的 push 未触发（实测丢过一次），每天全量跑一遍
  schedule:
    - cron: '0 3 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 中文字体（架构图需要；最小化镜像默认没有）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-list :lang=zh | head -3
      - name: 依赖
        run: python -m pip install -q -r requirements.txt
      - name: 单元测试
        run: python -m unittest discover -s tests -v
      - name: 转换冒烟（真实产出 .docx）
        run: |
          mkdir -p /tmp/out
          python scripts/md2office.py --input examples/demo/sample.md --output /tmp/out --format docx
          test -s /tmp/out/sample.docx
      - name: 公文模板端到端（生成模板→登记→填充→校验）
        if: matrix.python == '3.11'
        run: |
          export GONGWEN_HOME=/tmp/gwstore
          python examples/gongwen/make_blank_template.py --out /tmp/blank.docx
          python scripts/gongwen.py template add /tmp/blank.docx --name blank
          python - <<'PY'
          import json
          data = {
              "标题": "测试通知", "主送机关": "各处室：",
              "正文": "第一段。\n第二段。", "附件说明": "附件：无",
              "成文日期": "2026年10月21日", "版记": "抄送：办公室。",
          }
          json.dump(data, open("/tmp/d.json", "w"), ensure_ascii=False)
          PY
          python scripts/gongwen.py render --template blank --data /tmp/d.json --out /tmp/成文.docx
          python scripts/gongwen.py check /tmp/成文.docx --template blank

      - name: 演示素材可重新生成（ASCII 图 → 真框图）
        if: matrix.python == '3.11'
        run: |
          python tools/make_convert_gif.py --out /tmp/convert.gif
          test -s /tmp/convert.gif
          python - <<'PY'
          from PIL import Image
          im = Image.open('/tmp/convert.gif')
          assert im.n_frames >= 20, im.n_frames
          assert im.size[0] >= 1000, im.size
          print("演示素材 OK：", im.size, im.n_frames, "帧")
          PY

      - name: 演示素材新鲜度（首屏图与动图都在，且不是占位文件）
        if: matrix.python == '3.11'
        run: |
          python - <<'PY'
          import os
          for p, low in (("docs/demo-convert.gif", 200_000), ("docs/demo-convert-story.png", 100_000)):
              assert os.path.getsize(p) > low, f"{p} 太小，可能是占位/过期素材"
          print("演示素材 OK")
          PY

      - name: 断言产物不是空壳（标题/表格/字符画都在）
        run: |
          python - <<'PY'
          import docx
          d = docx.Document('/tmp/out/sample.docx')
          text = "\n".join(p.text for p in d.paragraphs)
          assert "示例文档" in text, "标题丢了"
          assert "架构" in text, "章节丢了"
          # 未提供 spec 时字符画必须原样保留 —— 静默删除比报错更危险
          assert "┌" in text or "┌" in "\n".join(c.text for t in d.tables for r in t.rows for c in r.cells), "字符画被静默删除"
          assert len(d.tables) >= 1, "表格丢了"
          print("产物检查通过：段落", len(d.paragraphs), "表格", len(d.tables))
          PY

  # PDF 路径单独一个 job：LibreOffice 体积大，只跑一个 Python 版本，不拖慢主矩阵。
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 依赖
        run: python -m pip install -q python-docx Pillow
      - name: 单元测试（无中文字体的用例会自动跳过）
        run: python -m unittest discover -s tests -v
      - name: Windows 冒烟（真实转换 + 中文/空格路径）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "交付 目录" | Out-Null
          Copy-Item examples/demo/sample.md "交付 目录/方案 样例.md"
          python scripts/md2office.py --input "交付 目录" --output "导出 目录" --format docx
          if (-not (Test-Path "导出 目录/方案 样例.docx")) { throw "Windows 上未生成 docx" }
          Write-Host "Windows 冒烟 OK"

  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: LibreOffice（PDF 后端）+ 中文字体
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-writer fonts-noto-cjk
          soffice --version | head -1
      - name: 依赖
        run: python -m pip install -q -r requirements.txt pypdf
      - name: 真实转出 PDF（走 soffice 后端）
        run: |
          mkdir -p /tmp/pdfout
          python scripts/md2office.py --input examples/demo/sample.md --output /tmp/pdfout --format pdf
          ls -l /tmp/pdfout
          test -s /tmp/pdfout/sample.pdf
      - name: 断言 PDF 可读且不是空白
        run: |
          python - <<'PY'
          from pypdf import PdfReader
          r = PdfReader('/tmp/pdfout/sample.pdf')
          assert len(r.pages) >= 1, "没有页"
          text = "".join((p.extract_text() or "") for p in r.pages)
          assert "示例文档" in text, "PDF 里没有正文（可能是空白页）"
          print("PDF 检查通过：页数", len(r.pages), "字符", len(text))
          PY
